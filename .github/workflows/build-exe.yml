name: "Build Executables"

on:
  push:
    branches:
      - main
      - linux
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Task
        uses: arduino/setup-task@v2
      - run: task dist-win

  build-exe:
    if: github.event_name == 'push'
    runs-on: [ windows-latest ]
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - run: task dist-win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: dist/WatchmanPairingAssistant.exe
          name: executable
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          artifacts: dist/WatchmanPairingAssistant.exe
  build-lin:
    needs: build-exe
    runs-on: [ ubuntu-latest ]
    env:
        RELEASEVERSION: ${{ needs.build-exe.outputs.new_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Sanitize version
        run: |
             CLEAN=$(echo "$RELEASEVERSION" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//')
             echo "RELEASEVERSION=$CLEAN" >> "$GITHUB_ENV"
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - run: task dist-lin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: source/dist/*.AppImage
          name: executable
      - name: Attach AppImage to existing release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.build-exe.outputs.new_tag }}
          allowUpdates: true
          artifacts: |
                     source/dist/*.AppImage
                     source/dist/*.zsync
